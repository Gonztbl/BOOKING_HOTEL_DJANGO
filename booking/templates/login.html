<!-- templates/login.html -->
{% extends 'base.html' %}
{% block title %}Đăng nhập - HotelBooking{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-header">
        <h2>Chào mừng trở lại</h2>
        <p>Đăng nhập để tiếp tục kế hoạch du lịch của bạn</p>
    </div>
    
    <form method="post" class="auth-form">
        {% csrf_token %}
        <div class="auth-field">
            <label for="id_email">
                <i data-lucide="mail"></i>
                <span>Địa chỉ Email</span>
            </label>
            <input type="email" name="email" id="id_email" placeholder="example@email.com" required>
        </div>
        
        <div class="auth-field">
            <label for="id_password">
                <i data-lucide="lock"></i>
                <span>Mật khẩu</span>
            </label>
            <input type="password" name="password" id="id_password" placeholder="••••••••" required>
        </div>
        
        <button type="submit" class="btn-auth-submit">Đăng nhập</button>
    </form>

    <div class="auth-footer">
        <span>Bạn chưa có tài khoản? </span>
        <a href="{% url 'register' %}">Đăng ký ngay</a>
    </div>
</div>
{% endblock %}
